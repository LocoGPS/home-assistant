name: Release

# Pushing an annotated tag such as v0.1.0 creates the GitHub release. The tag
# message body becomes the release notes, and the tag must match the version in
# the manifest.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check manifest version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/locogps/manifest.json'))['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Manifest version ${version} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Read release notes from the tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
